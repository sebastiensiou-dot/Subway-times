<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff8000">
<title>Subway Times</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1a1a1a; --muted: #6b6b6b;
    --accent: #ff8000; --go: #1a8f4c; --warn: #b3261e; --line: #e4e4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1e1e1e; --text: #f2f2f2; --muted: #9a9a9a; --line: #2e2e2e; --go: #46c47a; --warn: #ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  h1 .badge { background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 8px; font-weight: 700; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 600; }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hero { background: var(--card); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid var(--line); }
  .hero .label { color: var(--muted); font-size: 14px; }
  .hero .big { font-size: 56px; font-weight: 800; line-height: 1.1; margin: 4px 0; }
  .hero .big.go { color: var(--go); }
  .hero .big.hurry { color: var(--warn); }
  .hero .sub { color: var(--muted); }
  .list { background: var(--card); border-radius: 16px; border: 1px solid var(--line); margin-top: 12px; }
  .row { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .tag { font-size: 13px; }
  .row .tag.ok { color: var(--go); } .row .tag.miss { color: var(--muted); }
  .alert { background: var(--card); border-left: 4px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
  .err { color: var(--warn); }
  .alert .ln { font-weight: 700; margin-right: 6px; }
  .more { color: var(--muted); font-size: 14px; margin: 10px 0 0; cursor: pointer; }
  .src { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .alert.none { border-left-color: var(--go); color: var(--muted); }
  h2 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  h2 .badge { background: #ffc524; color: #1a1a1a; border-radius: 6px; padding: 1px 8px; font-weight: 700; }
  .l1 .row { align-items: center; }
  .l1 .dest { font-size: 13px; color: var(--muted); }
  .l1 .times { font-weight: 700; font-size: 18px; text-align: right; }
  footer { margin-top: 16px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  footer input { width: 56px; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
</style>
</head>
<body>
<main>
  <h1 id="title"><span class="badge">5</span> Laird to St Andrew</h1>
  <div class="tabs" role="group" aria-label="Trip">
    <button id="tab-work" aria-pressed="true">To St Andrew</button>
    <button id="tab-home" aria-pressed="false">Home</button>
  </div>
  <div id="alerts"></div>
  <div id="hero" class="hero"><div class="label">Loading…</div></div>
  <div id="list" class="list" hidden></div>
  <h2 id="side-title"></h2>
  <div id="side" class="list l1"><div class="row">Loading…</div></div>
  <footer>
    <label>Walk <input id="walk" type="number" min="0" max="60" inputmode="numeric"> + buffer <input id="buffer" type="number" min="0" max="30" inputmode="numeric"> min</label>
    <span id="status"></span>
  </footer>
</main>
<script>
// Platform stop codes from the TTC's GTFS stops list. Keys are used throughout.
const STOPS = {
  laird: "16076",       // Line 5 westbound at Laird (to Mount Dennis)
  lairdE: "16075",      // Line 5 eastbound at Laird, only used for the delay check
  eglE: "16073",        // Line 5 eastbound at Eglinton (to Kennedy)
  egl1S: "13795",       // Line 1 southbound at Eglinton (to Union)
  stAndrew: "13818",    // Line 1 at St Andrew, the platform for trains heading to Union and on to Finch
};
const NTAS = "https://ntas.ttc.ca/api/ntas/get-next-train-time/";
// The TTC alerts feed blocks browser requests, so a scheduled job saves it to alerts.json.
const ALERTS = "alerts.json";
const REFRESH_MS = 20000;
// Scheduled ride times from the TTC's GTFS schedule (median), and a guess at the walk between the Line 5 and Line 1 platforms.
const L5_RIDE_MIN = 6;         // Laird <-> Eglinton
const L1_SB_RIDE_MIN = 17;     // Eglinton to St Andrew
const L1_NB_RIDE_MIN = 18;     // St Andrew to Eglinton
const TRANSFER_MIN = 4;
// Line 1 stations in order, Finch to Vaughan, so alerts can be matched to the Eglinton to St Andrew trip.
const LINE1 = ["Finch", "North York Centre", "Sheppard-Yonge", "York Mills", "Lawrence", "Eglinton", "Davisville", "St Clair",
  "Summerhill", "Rosedale", "Bloor-Yonge", "Wellesley", "College", "TMU", "Queen", "King", "Union", "St Andrew", "Osgoode",
  "St Patrick", "Queen's Park", "Museum", "St George", "Spadina", "Dupont", "St Clair West", "Cedarvale", "Eglinton West", "Glencairn",
  "Lawrence West", "Yorkdale", "Wilson", "Sheppard West", "Downsview Park", "Finch West", "York University", "Pioneer Village",
  "Highway 407", "Vaughan Metropolitan Centre"];
const TRIP = [LINE1.indexOf("Eglinton"), LINE1.indexOf("St Andrew")];
// The TTC alerts feed has nothing for Line 5, so a long gap in live train times stands in for a disruption notice.
const LONG_WAIT_MIN = 15;

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// Heading out in the morning, heading home after noon; the buttons override.
let mode = new Date().getHours() < 12 ? "work" : "home";
// Home to Laird is ~350 m (about 5 min on foot); the buffer covers the stairs and platform.
let walk = Number(store.get("walk2", 5));
let buffer = Number(store.get("buffer", 2));
let fetched = {};   // stop key -> { minutes: [..], at: ms }
let alerts = [];
let alertsOk = false;
let alertsChecked = 0;
let lastError = null;

async function loadTrains(key) {
  const res = await fetch(NTAS + STOPS[key], { cache: "no-store" });
  if (!res.ok) throw new Error("TTC returned " + res.status);
  const data = await res.json();
  const text = (data[0] && data[0].nextTrains) || "";
  const minutes = text.split(",").map((s) => parseInt(s, 10)).filter((n) => !isNaN(n));
  fetched[key] = { minutes, at: Date.now() };
}

async function loadAlerts() {
  const res = await fetch(ALERTS, { cache: "no-store" });
  if (!res.ok) return;
  const data = await res.json();
  const now = Date.now();
  alertsChecked = new Date(data.checked).getTime();
  alerts = (data.alerts || []).filter((a) => {
    const start = a.start ? new Date(a.start).getTime() : 0;
    const end = a.end ? new Date(a.end).getTime() : 0;
    return start <= now && (end < Date.UTC(2000, 0, 1) || end >= now);
  });
  alertsOk = Date.now() - alertsChecked < 3 * 3600 * 1000;
}

async function refresh() {
  try {
    await Promise.all([...Object.keys(STOPS).map(loadTrains), loadAlerts().catch(() => {})]);
    lastError = null;
  } catch (e) {
    lastError = e;
  }
  render();
}

// Minutes until each listed train, corrected for the time since the data was fetched.
function live(key) {
  const f = fetched[key];
  if (!f) return null;
  const elapsed = (Date.now() - f.at) / 60000;
  return f.minutes.map((m) => Math.max(0, Math.round(m - elapsed)));
}

const clock = (minFromNow) => new Date(Date.now() + minFromNow * 60000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const mins = (n) => (n === 0 ? "Now" : n + " min");

function render() {
  $("tab-work").setAttribute("aria-pressed", mode === "work");
  $("tab-home").setAttribute("aria-pressed", mode === "home");
  $("walk").value = walk;
  $("buffer").value = buffer;
  if (mode === "work") renderWork(); else renderHome();
  renderAlerts();
  const f = fetched.laird;
  $("status").textContent = f ? "Updated " + new Date(f.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
}

function unavailable() {
  return lastError
    ? '<div class="label err">Can\'t reach TTC data right now.<br>Check the board at the station or ttc.ca.</div>'
    : '<div class="label">Loading…</div>';
}

function renderWork() {
  $("title").innerHTML = '<span class="badge">5</span> Laird to St Andrew';
  const need = walk + buffer;
  const hero = $("hero"), list = $("list");
  const trains = live("laird");
  if (!trains) {
    hero.innerHTML = unavailable();
    list.hidden = true;
  } else {
    const catchable = trains.find((t) => t >= need);
    if (!trains.length) {
      hero.innerHTML = '<div class="label">No trains listed right now</div>';
    } else if (catchable === undefined) {
      hero.innerHTML = `<div class="label">You'd miss all listed trains</div>
        <div class="big hurry">Hurry</div><div class="sub">Next is ${trains[0]} min away, you need ${need} min to get there</div>`;
    } else {
      const leave = catchable - need;
      hero.innerHTML = `<div class="label">Leave in</div>
        <div class="big ${leave <= 2 ? "hurry" : "go"}">${leave <= 0 ? "Now" : leave + " min"}</div>
        <div class="sub">to catch the ${catchable}-min train to Mount Dennis</div>${tripWork(catchable, leave)}`;
    }
    list.hidden = !trains.length;
    list.innerHTML = trains.map((t) => {
      const ok = t >= need;
      return `<div class="row"><span>${mins(t)}</span><span class="tag ${ok ? "ok" : "miss"}">${ok ? "leave in " + (t - need) + " min" : "too soon"}</span></div>`;
    }).join("");
  }
  $("side-title").innerHTML = '<span class="badge">1</span> Eglinton southbound';
  const sb = live("egl1S");
  $("side").innerHTML = `<div class="row"><span class="dest">To Union and St Andrew</span><span class="times">${
    sb ? (sb.length ? sb.map((n) => (n === 0 ? "Now" : n)).join(", ") + " min" : "–") : "…"}</span></div>`;
}

// Door-to-platform estimate for the train you'd catch: Line 5 to Eglinton, transfer, next Line 1 southbound, ride to St Andrew.
function tripWork(catchable, leave) {
  const atEgl = catchable + L5_RIDE_MIN;
  let out = `<div class="sub" style="margin-top:8px">Reach Eglinton in about ${atEgl} min.`;
  const sb = live("egl1S");
  const next = sb && sb.find((t) => t >= atEgl + TRANSFER_MIN);
  if (next !== undefined && next !== null) {
    const arrive = next + L1_SB_RIDE_MIN;
    out += ` Next Line 1 southbound you'd make is in ${next} min.</div>` +
      `<div class="sub" style="margin-top:8px"><b>St Andrew about ${clock(arrive)}</b> (${arrive - leave} min after you leave the house)`;
  }
  return out + "</div>";
}

function renderHome() {
  $("title").innerHTML = '<span class="badge">1</span> St Andrew to Laird';
  const hero = $("hero"), list = $("list");
  const trains = live("stAndrew");
  const east = live("eglE");
  if (!trains) {
    hero.innerHTML = unavailable();
    list.hidden = true;
  } else if (!trains.length) {
    hero.innerHTML = '<div class="label">No trains listed right now</div>';
    list.hidden = true;
  } else {
    // For each train from St Andrew: reach Eglinton, walk to Line 5, take the first eastbound you can make, ride to Laird, walk home.
    const eta = (t) => {
      const atEgl = t + L1_NB_RIDE_MIN + TRANSFER_MIN;
      const e = east && east.find((x) => x >= atEgl);
      return e === undefined || e === null ? null : e + L5_RIDE_MIN + walk;
    };
    const first = eta(trains[0]);
    hero.innerHTML = `<div class="label">Next train at St Andrew</div>
      <div class="big go">${mins(trains[0])}</div>
      <div class="sub">to Union, then north to Eglinton</div>` +
      (first === null ? "" : `<div class="sub" style="margin-top:8px"><b>Home about ${clock(first)}</b> (${first} min from now)</div>`);
    list.hidden = false;
    list.innerHTML = trains.map((t) => {
      const h = eta(t);
      return `<div class="row"><span>${mins(t)}</span><span class="tag ok">${h === null ? "" : "home about " + clock(h)}</span></div>`;
    }).join("");
  }
  $("side-title").innerHTML = '<span class="badge">5</span> Eglinton eastbound';
  $("side").innerHTML = `<div class="row"><span class="dest">To Laird and Kennedy</span><span class="times">${
    east ? (east.length ? east.map((n) => (n === 0 ? "Now" : n)).join(", ") + " min" : "–") : "…"}</span></div>`;
}

function renderAlerts() {
  const l5 = lineFiveWarnings();
  const alertHtml = (a) => `<div class="alert"><span class="ln">Line ${esc(a.route)}</span>${esc(a.text.replace(/^Line \d[^:]*:\s*/, ""))}` +
    `<span class="src">${a.updated ? "Updated " + ago(a.updated) : ""}${a.start && a.start > "2000" ? " · in effect since " + shortDate(a.start) : ""}</span></div>`;
  if (!alertsChecked) $("alerts").innerHTML = l5 + "";
  else if (!alertsOk) $("alerts").innerHTML = l5 + '<div class="alert">Service alerts may be out of date. Check ttc.ca.</div>';
  else if (!alerts.length) $("alerts").innerHTML = l5 + '<div class="alert none">No TTC alerts for Line 1. The TTC feed does not cover Line 5.</div>';
  else {
    const rank = { Critical: 0, Major: 1 };
    const bySeverity = (x, y) => (rank[x.severity] ?? 2) - (rank[y.severity] ?? 2);
    const mine = alerts.filter(onMyTrip).sort(bySeverity);
    const other = alerts.filter((a) => !mine.includes(a)).sort(bySeverity);
    $("alerts").innerHTML = l5 + (mine.length ? mine.map(alertHtml).join("") : '<div class="alert none">Nothing on your Eglinton to St Andrew trip.</div>') +
      (other.length ? `<details><summary class="more">${other.length} alert${other.length > 1 ? "s" : ""} not on your trip</summary>${other.map(alertHtml).join("")}</details>` : "");
  }
}

function lineFiveWarnings() {
  const out = [];
  for (const [key, label] of [["laird", "Westbound"], ["lairdE", "Eastbound"]]) {
    const f = fetched[key];
    if (!f) continue;
    const m = f.minutes;
    if (!m.length) {
      out.push(`${label}: no trains listed. Service may have ended or be disrupted.`);
      continue;
    }
    const gaps = m.map((t, i) => (i === 0 ? t : t - m[i - 1]));
    if (Math.max(...gaps) >= LONG_WAIT_MIN) {
      out.push(`${label}: long gap between trains (${m.join(", ")} min). Possible delay.`);
    }
  }
  return out.map((t) => `<div class="alert"><span class="ln">Line 5</span>${esc(t)} <span class="src">From live train times, not an official TTC notice.</span></div>`).join("");
}

// On the trip unless the alert is on a Line 1 stretch that doesn't overlap Eglinton to St Andrew. Heading to St Andrew,
// northbound-only notices don't apply; heading home the trip runs both ways, so direction is ignored.
function onMyTrip(a) {
  if (a.route !== "1") return false;
  if (mode === "work" && /northbound/i.test(a.text) && !/southbound/i.test(a.text)) return false;
  const m = a.text.match(/(?:from|between) (.+?) (?:to|and) (.+?) stations?/i);
  if (!m) return true;
  const idx = [m[1], m[2]].map((n) => LINE1.findIndex((x) => x.toLowerCase() === n.trim().toLowerCase()));
  if (idx.includes(-1)) return true;
  return Math.min(...idx) <= TRIP[1] && Math.max(...idx) >= TRIP[0];
}

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return "just now";
  if (min < 60) return min + " min ago";
  if (min < 1440) return Math.round(min / 60) + " h ago";
  if (min < 7 * 1440) return Math.round(min / 1440) + " days ago";
  return shortDate(iso);
}

function shortDate(iso) {
  return new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" });
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

$("tab-work").onclick = () => { mode = "work"; render(); };
$("tab-home").onclick = () => { mode = "home"; render(); };
$("walk").oninput = (e) => {
  const n = Number(e.target.value);
  if (!isNaN(n) && n >= 0) { walk = n; store.set("walk2", n); render(); }
};
$("buffer").oninput = (e) => {
  const n = Number(e.target.value);
  if (!isNaN(n) && n >= 0) { buffer = n; store.set("buffer", n); render(); }
};

refresh();
setInterval(refresh, REFRESH_MS);
setInterval(render, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
