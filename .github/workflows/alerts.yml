name: Update alerts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_alerts.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain alerts.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add alerts.json
            git commit -m "Update alerts"
            git push
          fi
